[project]
name = "audiblez-mlx"
version = "0.5.0"
description = "Generate audiobooks from e-books, using Kokoro on torch (MLX optional, Apple Silicon only)"
authors = [
    { name = "Claudio Santini", email = "hireclaudio@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ebooklib (>=0.18,<0.19)",
    "soundfile (>=0.13.1,<0.14.0)",
    "pick (>=2.4.0,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "spacy (>=3.8.3,<4.0.0)",
    "misaki[en,zh] (>=0.9.2)",
    # Traditional -> simplified before phonemization: misaki's jieba/pypinyin dictionaries
    # are simplified-keyed. Pure Python, no build step. See audiblez/chinese.py.
    "opencc-python-reimplemented (>=0.1.7,<0.2.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    # Kokoro on torch is the default engine: portable, runs on any CPU (and any CUDA GPU
    # via --cuda). Pulls in torch (~2GB). The alternative MLX engine is an opt-in extra.
    "kokoro (==0.9.4)",
]

[project.optional-dependencies]
# Apple Silicon only: Kokoro through MLX on the Apple GPU, ~3.8x faster than torch but
# historically linked to kernel panics on some machines, which is why it is no longer the
# default. Opt in explicitly when you want the speed-up.
mlx = [
    "mlx-audio (>=0.5.0) ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Legacy no-op alias so `pip install ".[torch]"` still works for old instructions; the
# torch engine is now part of the core dependency set.
torch = [
]
# Microsoft Edge's online TTS: high-quality neural voices (incl. real Cantonese and
# native traditional-script reading) with no model download. Requires network at
# synthesis time; the book's text is sent to Microsoft's servers.
edge = [
    "edge-tts (>=7.2.0)",
]
gui = [
    "wxpython (>=4.2)",
    "pillow (>=10.0)",
]

[tool.poetry]
# The distribution is audiblez-mlx but the import package is still audiblez, so that
# existing code and docs keep working; poetry-core needs telling.
packages = [{ include = "audiblez" }]
# PEP 621 [project] has no "exclude" key, so this has to live under [tool.poetry]
# for poetry-core to honour it when building the sdist/wheel.
exclude = [
    "imgs",
    "test",
    "docs",
    "*.wav",
    "*.m4b",
    "cover",
    "chapters.txt"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Repository = "https://github.com/simgsr/audiblez-mlx"
Issues = "https://github.com/simgsr/audiblez-mlx/issues"
"Upstream project" = "https://github.com/santinic/audiblez"

[project.scripts]
audiblez = "audiblez.cli:cli_main"
audiblez-ui = "audiblez.ui:main"

[tool.poetry.group.dev.dependencies]
deptry = "^0.23.0"